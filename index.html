<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>HidzRun</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <style>
      /* Background: Road/Sky map vibe */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 50%, #50c878 50%, #228B22 100%);
        overflow: hidden; 
      }

      /* Game Overlay UI */
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; 
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* Align items to bottom */
        align-items: center;
        z-index: 10;
      }

      /* Left/Right Buttons Container */
      .controls-container {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 40px 60px 40px; /* Adjust padding for positioning */
        box-sizing: border-box;
        pointer-events: auto;
      }

      /* Button Styling */
      .control-btn {
        width: 80px;
        height: 80px;
        background-color: rgba(255, 255, 255, 0.6);
        border: 4px solid #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        transition: transform 0.1s, background-color 0.2s;
        touch-action: manipulation;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }

      .control-btn:active {
        background-color: rgba(255, 215, 0, 0.9); /* Gold when pressed */
        transform: scale(0.9);
      }

      /* SVG Icon Styling */
      .control-btn svg {
        width: 40px;
        height: 40px;
        fill: #333;
        stroke: #333;
        stroke-width: 1;
      }

      /* Ensure Unity container sits correctly */
      #unity-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1;
      }

      /* Label brand di layar loading */
      #unity-loading-title {
        width: 154px;
        margin-top: 8px;
        text-align: center;
        color: #f1f1f1;
        font-family: arial;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    
    <!-- UI Overlay -->
    <div id="ui-overlay">
      <!-- Controls with SVG Buttons -->
      <div class="controls-container">
        
        <!-- Left Button SVG -->
        <div class="control-btn" id="btn-left">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </div>

        <!-- Right Button SVG -->
        <div class="control-btn" id="btn-right">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </div>

      </div>
    </div>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-loading-title">HidzForum</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">HidzRun</div>
      </div>
    </div>

    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/EndlessRun.loader.js";
      var config = {
        dataUrl: buildUrl + "/EndlessRun.data",
        frameworkUrl: buildUrl + "/EndlessRun.framework.js",
        codeUrl: buildUrl + "/EndlessRun.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HidzRun",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

                // --- LOGIC FOR LEFT/RIGHT BUTTONS ---
                
                function sendKey(key, type) {
                  var keyCode = (key === 'ArrowLeft') ? 37 : 39;
                  
                  document.dispatchEvent(new KeyboardEvent(type, {
                    key: key,
                    code: key,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true
                  }));

                  canvas.dispatchEvent(new KeyboardEvent(type, {
                    key: key,
                    code: key,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true
                  }));
                }

                // Setup Left Button
                const btnLeft = document.getElementById('btn-left');
                const handleLeftDown = (e) => { e.preventDefault(); sendKey('ArrowLeft', 'keydown'); };
                const handleLeftUp = (e) => { e.preventDefault(); sendKey('ArrowLeft', 'keyup'); };
                
                btnLeft.addEventListener('mousedown', handleLeftDown);
                btnLeft.addEventListener('mouseup', handleLeftUp);
                btnLeft.addEventListener('touchstart', handleLeftDown);
                btnLeft.addEventListener('touchend', handleLeftUp);

                // Setup Right Button
                const btnRight = document.getElementById('btn-right');
                const handleRightDown = (e) => { e.preventDefault(); sendKey('ArrowRight', 'keydown'); };
                const handleRightUp = (e) => { e.preventDefault(); sendKey('ArrowRight', 'keyup'); };

                btnRight.addEventListener('mousedown', handleRightDown);
                btnRight.addEventListener('mouseup', handleRightUp);
                btnRight.addEventListener('touchstart', handleRightDown);
                btnRight.addEventListener('touchend', handleRightUp);

                // -------------------------------------------

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
